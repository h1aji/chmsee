name: Build Debian package

# No branches/tags filter below means ALL pushes match, including version
# tags such as "3.1.0" - that's what makes pushing a tag trigger this build.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config build-essential gettext dpkg-dev file \
            libgtk-3-dev libwebkit2gtk-4.1-dev libxml2-dev libchm-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel

      - name: Package and inspect
        run: |
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          deb=(dist/*.deb)
          test "${#deb[@]}" -eq 1
          dpkg-deb --info "${deb[0]}"
          dpkg-deb --contents "${deb[0]}"
          test -n "$(dpkg-deb --field "${deb[0]}" Depends)"

      - name: Upload Debian package
        uses: actions/upload-artifact@v5
        with:
          name: chmsee-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish release asset
    needs: deb
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Debian package
        uses: actions/download-artifact@v5
        with:
          name: chmsee-deb
          path: dist

      - name: Create release and attach .deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.deb \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
