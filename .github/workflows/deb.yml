name: Build Debian package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config build-essential gettext dpkg-dev file \
            libgtk-3-dev libwebkit2gtk-4.1-dev libxml2-dev libchm-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel

      - name: Package and inspect
        run: |
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          deb=(dist/*.deb)
          test "${#deb[@]}" -eq 1
          dpkg-deb --info "${deb[0]}"
          dpkg-deb --contents "${deb[0]}"
          test -n "$(dpkg-deb --field "${deb[0]}" Depends)"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: chmsee-deb
          path: dist/*.deb
          if-no-files-found: error
